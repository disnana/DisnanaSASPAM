[workspace]
resolver = "2"
members = [
  "crates/saspam-protocol",
  "crates/saspam-pam",
  "crates/saspam-daemon",
  "crates/saspam-cli",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/disnana/DisnanaSASPAM"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
