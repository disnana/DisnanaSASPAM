name: Pin Cargo.lock (one-shot maintenance)

on:
  push:
    branches: [feat/initial-post-auth-pam]
    paths: [.github/workflows/lockfile-once.yml]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and commit deterministic dependency manifest
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: pin Rust dependency graph in Cargo.lock"
          git push origin HEAD:feat/initial-post-auth-pam
