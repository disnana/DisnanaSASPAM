name: CI
on:
  push:
    branches: [main, feat/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PAM development library
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust unit tests
        run: cargo test --workspace
      - name: Generate Cargo lockfile for reviewed source bundle
        if: matrix.arch == 'amd64'
        run: base64 -w 72 Cargo.lock | sed 's/^/SASPAM_LOCK_CHUNK: /'
      - name: Build release artifacts
        run: cargo build --release --workspace

  scripts:
    name: Python and shell validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Discord test dependency
        run: python -m pip install -r integrations/discord/requirements.txt
      - name: Syntax checks
        run: |
          python3 -m py_compile integrations/discord/bot.py
          bash -n scripts/install.sh scripts/install-from-build.sh scripts/uninstall.sh
      - name: Static scope regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
