name: Experimental verified method bridge (not for production)
on:
  pull_request:
    paths:
      - 'crates/saspam-pam/**'
      - 'crates/saspam-protocol/**'
      - 'integrations/discord/**'
      - 'experimental/openssh/**'
      - 'tests/integration/verified_auth_roundtrip.sh'
      - '.github/workflows/verified-auth-bridge-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-sshd:
    name: Patched OpenSSH auth method validation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PAM / OpenSSH research dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential             libpam0g-dev openssh-server sshpass libssl-dev zlib1g-dev             libtool autoconf automake pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build research SASPAM
        run: cargo build --locked --release --workspace
      - name: Obtain pinned upstream OpenSSH portable sources
        run: |
          set -Eeuo pipefail
          git clone --quiet https://github.com/openssh/openssh-portable.git _openssh
          cd _openssh
          git checkout --quiet 0351d353099d1dcd75ac456720dd14fd90ad1cfb
          test "$(git rev-parse HEAD)" = 0351d353099d1dcd75ac456720dd14fd90ad1cfb
          patch --dry-run -p1 < ../experimental/openssh/V_10_6_P2-saspam-authinfo.patch
          patch -p1 < ../experimental/openssh/V_10_6_P2-saspam-authinfo.patch
      - name: Verify upstream is OpenSSH 10.6p2 with security workaround
        run: |
          grep -F '#define SSH_PORTABLE' _openssh/version.h | grep -Fq '"p2"'
          grep -Fq 'MIN_PASSWORD_HASH_LEN' _openssh/auth-passwd.c
      - name: Build patched sshd for localhost-only testing
        run: |
          set -Eeuo pipefail
          cd _openssh
          autoreconf -fi
          ./configure --with-pam --with-privsep-path=/run/sshd --prefix=/usr/local/saspam-experimental --libexecdir="$PWD"
          # OpenSSH 10.x launches the separate sshd-auth and sshd-session executables.
          make -j2 sshd sshd-auth sshd-session ssh ssh-keygen ssh-sk-helper regress/misc/sk-dummy/sk-dummy.so
          test -x ./sshd && test -x ./sshd-auth && test -x ./sshd-session
          test -x ./ssh && test -x ./ssh-keygen && test -f ./regress/misc/sk-dummy/sk-dummy.so
      - name: Actual PAM account approved publickey/password classification
        env:
          SASPAM_TEST_SSHD_BIN: ${{ github.workspace }}/_openssh/sshd
          SASPAM_TEST_DUMMY_FIDO: '1'
          SASPAM_TEST_SK_PROVIDER: ${{ github.workspace }}/_openssh/regress/misc/sk-dummy/sk-dummy.so
          SASPAM_TEST_KEYGEN: ${{ github.workspace }}/_openssh/ssh-keygen
          SASPAM_TEST_SSH: ${{ github.workspace }}/_openssh/ssh
        run: |
          echo 'Experimental sshd is limited to a disposable VM localhost port'
          bash tests/integration/verified_auth_roundtrip.sh
      - name: Debug experimental SSH unit on failure
        if: failure()
        run: |
          sudo journalctl -u saspam-sshd-ci -u saspamd-ci --no-pager -n 120 || true
          ls -lh _openssh/sshd* || true
