name: Stop superseded 24.04-built release workflow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
permissions:
  actions: write
jobs:
  cancel-old-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel prerelease build superseded by Ubuntu 22.04 builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/42079420085/cancel" || true
